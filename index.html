<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101318" />
  <title>RPG Prototype</title>
  <link rel="stylesheet" href="/style.css?v=bow-equipment-1" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="panel title-panel"><b>RPG PROTOTYPE</b><span>장검 / 활 · 스킬 · 3스택 대쉬</span></div>
    <div class="panel status-panel">
      <div class="row"><span>대쉬</span><div id="dash-pips" class="pips"></div></div>
      <div class="row hp-row"><span>내 HP</span><div class="hp-track"><div id="player-hp" class="hp-fill"></div></div></div>
      <div class="row"><span>고블린</span><button id="dummy-mode" class="small-btn">↻ 고블린 리셋</button></div>
      <div class="row hp-row"><span>적 HP</span><div class="hp-track"><div id="dummy-hp" class="hp-fill"></div></div></div>
    </div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="lock-marker" aria-hidden="true">◆</div>
    <div id="toast"></div>
  </div>
  <div id="camera-zone" aria-label="카메라 조작 영역"></div>
  <div id="left-controls"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
  <div id="right-controls">
    <button id="auto-btn" class="utility-btn active">AUTO CAM</button>
    <button id="lock-btn" class="utility-btn">LOCK</button>
    <button id="weapon-switch" class="utility-btn weapon-btn">장비: 장검</button>
    <div id="skill-cluster">
      <button id="skill-dash-slash" class="skill-btn"><span>돌진베기</span><small class="skill-cd">READY</small></button>
      <button id="skill-sword-wave" class="skill-btn"><span>검기</span><small class="skill-cd">READY</small></button>
      <button id="skill-spin" class="skill-btn"><span>회전격</span><small class="skill-cd">READY</small></button>
    </div>
    <button id="jump-btn" class="action-btn jump">JUMP</button>
    <button id="dash-btn" class="action-btn dash">DASH</button>
    <button id="attack-btn" class="action-btn attack">ATK</button>
  </div>
  <div id="desktop-help">WASD 이동 · J 공격 · Q 장비전환 · 1/2/3 장검 스킬 · Shift 대쉬 · Space 점프 · L 락온</div>
  <script type="module" src="/game.js?v=bow-equipment-1"></script>
</body>
</html>
